[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmaltm"
version = "0.2.0"
description = "Долгосрочная память (LTM) аптечного AI-ассистента: LLM извлекает смысл, состоянием памяти управляет код"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sergey Zemskov" }]
dependencies = [
    "pydantic>=2.6",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2"]
llm = ["transformers>=4.51", "accelerate>=0.30", "bitsandbytes>=0.43"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
